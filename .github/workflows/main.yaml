name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ignore-main-{0}', github.run_id) || format('{0}-{1}', github.workflow, github.ref_name) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-26.04
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.2.0
        with:
          workflows-ref: v3.1.8

      - uses: canonical/identity-credentials-workflows/.github/actions/setup-toolchains@v3.2.0
        with:
          toolchains: python charmcraft
          charmcraft-channel: latest/stable

      - name: Fetch charmcraft libs
        run: charmcraft fetch-libs

      - uses: canonical/identity-credentials-workflows/.github/actions/code-quality@v3.2.0
        with:
          python-enabled: "true"

      - uses: canonical/identity-credentials-workflows/.github/actions/unit-test@v3.2.0
        with:
          python-enabled: "true"

  build:
    needs:
      - quality
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.2.0
    with:
      path: ""
      fetch-libs: true

  build-arm:
    needs:
      - quality
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.2.0
    with:
      path: ""
      arch: arm64
      runner: '["self-hosted", "linux", "ARM64", "medium", "noble"]'
      fetch-libs: true

  integration-test:
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: "24.04"
            runner: '"ubuntu-24.04"'
          - base: "26.04"
            runner: '"ubuntu-26.04"'
    uses: ./.github/workflows/integration-test.yaml
    with:
      artifacts-key: ${{ needs.build.outputs.artifacts-key }}
      base: ${{ matrix.base }}
      arch: amd64
      runner: ${{ matrix.runner }}

  integration-test-arm:
    needs:
      - build-arm
    strategy:
      fail-fast: false
      matrix:
        base: ["24.04", "26.04"]
    uses: ./.github/workflows/integration-test.yaml
    with:
      artifacts-key: ${{ needs.build-arm.outputs.artifacts-key }}
      base: ${{ matrix.base }}
      arch: arm64
      runner: '["self-hosted", "linux", "ARM64", "xlarge", "noble"]'

  publish-charm-amd64:
    needs:
      - quality
      - integration-test
      - build
    if: ${{ github.ref_name == 'main' }}
    permissions:
      contents: write
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-publish.yaml@v3.2.0
    with:
      destination_channel: 1/edge
      artifacts-key: ${{ needs.build.outputs.artifacts-key }}
      charm-paths: ${{ needs.build.outputs.charm-paths }}
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}

  publish-charm-arm64:
    needs:
      - quality
      - integration-test-arm
      - build-arm
    if: ${{ github.ref_name == 'main' }}
    permissions:
      contents: write
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-publish.yaml@v3.2.0
    with:
      destination_channel: 1/edge
      artifacts-key: ${{ needs.build-arm.outputs.artifacts-key }}
      charm-paths: ${{ needs.build-arm.outputs.charm-paths }}
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
